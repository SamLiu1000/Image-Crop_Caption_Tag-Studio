<!DOCTYPE html>
<html lang="zh">
<head>
<script>
// 首帧前应用已保存的主题，避免明暗模式闪动（与 hub 默认一致：无记录时按暗色）
(function(){
  var theme = 'dark';
  try { theme = localStorage.getItem('web-tools-hub-theme') || 'dark'; } catch (e) { theme = 'dark'; }
  if (theme === 'dark' || theme === 'light') {
    document.documentElement.setAttribute('data-theme', theme);
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tag tool</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f14;--surface:#151820;--border:#252a35;--text:#c8cdd8;
  --muted:#5a6070;--white:#eef0f5;
  --c1:#4e9eff;--c2:#ff7eb3;--c3:#f0a500;--c4:#7ecfb3;--c5:#b088f9;--c6:#ff9f68;
  --tag-bg:#1a1e28;--tag-hover:#202535;
  --panel-bg:#0f1118;--img-bg:#080a10;--tag-col-bg:#0c0f16;
  --input-bg:#111520;--modal-bg:#13161f;--modal-input-bg:#0d1018;
  --gallery-hover:#111520;--gallery-active:#0f1e2e;
  --ctag-bg:#1a2030;--ctag-border:#2a3545;
  --tg-chip-bg:#1e1830;--tg-chip-border:#3d2e6a;--tg-chip-hover-bg:#2a2240;
  --added-bg:#0f1e14;--added-border:#3d8c3d;--added-color:#5cb85c;
  --danger:#ff6b6b;--danger-hover-bg:#1e0a0a;
  --nav-bar-bg:#0c0f16;--section-bar-bg:#0b0e15;
  --gallery-header-bg:#0d1018;--sidebar-bg:#0d1018;
  --tag-input-bg:#0a0d14;--toast-bg:#1d2430;
  --search-results-bg:#0e1218;
  --batch-hover-bg:#1e1a0a;--replace-hover-bg:#1e0a18;
  --left-w:calc((100vw - 24px) / 2);
  --left-min-w:320px;
  --left-max-w:1400px;
  --tag-sidebar-w:calc((100vw - 24px) / 4);
  --tag-sidebar-min-w:160px;
  --tag-sidebar-max-w:720px;
  --gallery-w:calc((100vw - 24px) / 4);
  --gallery-min-w:260px;
  --img-col-w:50%;
  --img-col-min-w:120px;
  --img-col-max-w:760px;
}
[data-theme="light"]{
  --bg:#f5f7fb;--surface:#ffffff;--border:#cfd8e6;--text:#1f2937;
  --muted:#6b7280;--white:#111827;
  --c1:#3b82f6;--c2:#db2777;--c3:#d97706;--c4:#059669;--c5:#7c3aed;--c6:#ea580c;
  --tag-bg:#f0f4ff;--tag-hover:#e0e7ff;
  --panel-bg:#ffffff;--img-bg:#f0f2f5;--tag-col-bg:#f8f9fb;
  --input-bg:#ffffff;--modal-bg:#ffffff;--modal-input-bg:#f8f9fb;
  --gallery-hover:#f0f4ff;--gallery-active:#eff6ff;
  --ctag-bg:#eef2ff;--ctag-border:#c7d2fe;
  --tg-chip-bg:#f5f3ff;--tg-chip-border:#ddd6fe;--tg-chip-hover-bg:#ede9fe;
  --added-bg:#ecfdf5;--added-border:#34d399;--added-color:#059669;
  --danger:#ef4444;--danger-hover-bg:#fef2f2;
  --nav-bar-bg:#f8f9fb;--section-bar-bg:#f8f9fb;
  --gallery-header-bg:#ffffff;--sidebar-bg:#ffffff;
  --tag-input-bg:#f8f9fb;--toast-bg:#ffffff;
  --search-results-bg:#f8f9fb;
  --batch-hover-bg:#fef3c7;--replace-hover-bg:#fce7f3;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;height:100vh;overflow:hidden;display:flex}
.main-container{display:flex;flex:1;overflow:hidden}

/* ════════════════════════════════════════════════
   LEFT PANEL — 780px fixed
════════════════════════════════════════════════ */
.left-panel{
  width:var(--left-w);min-width:var(--left-min-w);max-width:var(--left-max-w);
  background:var(--panel-bg);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;flex-shrink:0
}

/* Main panel resizer */
.panel-resizer{
  width:8px;background:transparent;cursor:ew-resize;z-index:30;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;position:relative
}
.panel-resizer::after{
  content:'';width:2px;height:60px;border-radius:2px;
  background:var(--muted);transition:all .15s
}
.panel-resizer:hover::after,.panel-resizer.dragging::after{background:var(--c4);height:80px}

/* Panel Header */
.panel-header{
  padding:10px 12px 9px;border-bottom:1px solid var(--border);
  flex-shrink:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap
}
.panel-title{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:5px;white-space:nowrap}
.panel-title::before{content:'◈';color:var(--c4);font-size:11px}
.import-btn{
  padding:6px 12px;background:var(--surface);border:1px solid var(--border);
  border-radius:5px;color:var(--c4);font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.07em;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;white-space:nowrap
}
.import-btn:hover{background:var(--tag-hover);border-color:var(--c4)}
.batch-btn{
  padding:6px 11px;background:var(--surface);border:1px solid var(--border);
  border-radius:5px;color:var(--c3);font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.07em;cursor:pointer;transition:all .15s;display:none;align-items:center;gap:6px;white-space:nowrap;position:relative
}
.batch-btn:hover{background:var(--batch-hover-bg);border-color:var(--c3)}
.batch-btn:disabled{opacity:.4;cursor:default;pointer-events:none}
.panel-stats{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-left:auto;white-space:nowrap}
.stat-val{color:var(--text)}

/* ── Body: image + tag side by side ── */
.panel-body{
  flex:1;display:flex;overflow:hidden;min-height:0
}

/* Image column */
.img-col{
  width:var(--img-col-w);min-width:var(--img-col-min-w);max-width:var(--img-col-max-w);
  background:var(--img-bg);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;position:relative
}
.col-resizer{
  position:absolute;right:-4px;top:0;bottom:0;width:8px;
  cursor:ew-resize;z-index:20;display:flex;align-items:center;justify-content:center
}
.col-resizer::after{
  content:'';width:2px;height:40px;border-radius:2px;
  background:var(--muted);transition:all .15s
}
.col-resizer:hover::after,.col-resizer.dragging::after{background:var(--c4);height:60px}

/* Page nav bar */
.page-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 10px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--nav-bar-bg)
}
.page-nav.hidden{display:none}
.page-counter{font-size:11px;color:var(--muted);letter-spacing:.07em}
.page-counter em{color:var(--white);font-style:normal;font-weight:600}
.page-filename{font-size:9px;color:var(--c4);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.nav-arrows{display:flex;gap:5px}
.arrow-btn{
  width:26px;height:26px;background:var(--surface);border:1px solid var(--border);
  border-radius:4px;color:var(--text);font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0
}
.arrow-btn:hover{background:var(--tag-hover);border-color:var(--c4);color:var(--c4)}
.arrow-btn:active{transform:scale(.92)}
.arrow-btn:disabled{opacity:.3;cursor:default;pointer-events:none}

/* Big image */
.big-image-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:var(--img-bg);position:relative;min-height:60px
}
.big-image-wrap.empty-wrap{flex-direction:column;gap:10px}
.big-img{max-width:100%;max-height:100%;object-fit:contain;display:block;transition:opacity .2s}
.big-video{max-width:100%;max-height:100%;border-radius:6px;background:#000;outline:none}
.big-img-placeholder{font-size:40px;opacity:.2}
.big-img-hint{font-size:10px;color:var(--muted);letter-spacing:.08em}

/* Big image zoom controls */
.img-zoom-bar{
  position:absolute;right:14px;bottom:12px;z-index:10;
  display:flex;gap:6px;align-items:center
}
.img-zoom-btn{
  padding:3px 10px;background:var(--surface);border:1px solid var(--border);border-radius:5px;
  color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:9px;cursor:pointer;
  transition:all .15s;box-shadow:0 2px 8px rgba(0,0,0,.35);white-space:nowrap
}
.img-zoom-btn:hover{border-color:var(--c4);color:var(--c4)}

/* Tag editing column */
.tag-col{
  flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--tag-col-bg)
}
.tag-col-header{
  padding:7px 10px 6px;font-size:10px;letter-spacing:.1em;color:var(--muted);
  text-transform:uppercase;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0
}
.tag-col-filename{color:var(--c4);font-size:10px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insert-mode-toggle{display:inline-flex;gap:0;border:1px solid var(--border);border-radius:4px;overflow:hidden;flex-shrink:0}
.insert-mode-btn{
  padding:2px 7px;background:var(--surface);border:none;color:var(--muted);
  font-family:'IBM Plex Mono',monospace;font-size:9px;cursor:pointer;transition:all .15s;
  white-space:nowrap;line-height:1.4
}
.insert-mode-btn:hover{color:var(--text)}
.insert-mode-btn.active{background:var(--c4);color:var(--white)}
.insert-mode-btn + .insert-mode-btn{border-left:1px solid var(--border)}
#ctagSelectToggle.active{background:var(--c5)}

/* Manual input */
.tag-input-row{display:flex;gap:5px;padding:6px 8px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--tag-input-bg)}
.tag-manual-input{
  flex:1;background:var(--input-bg);border:1px solid var(--border);border-radius:4px;
  color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:10px;
  padding:4px 7px;outline:none;transition:border-color .15s;min-width:0
}
.tag-manual-input:focus{border-color:var(--c4)}
.tag-manual-input::placeholder{color:var(--muted)}
.tag-add-btn{
  flex-shrink:0;padding:4px 8px;background:var(--surface);border:1px solid var(--c4);
  border-radius:4px;color:var(--c4);font-family:'IBM Plex Mono',monospace;font-size:10px;
  cursor:pointer;transition:all .15s;white-space:nowrap
}
.tag-add-btn:hover{background:var(--added-bg);color:var(--white)}

/* Search / replace */
.tag-search-row{
  display:flex;gap:4px;padding:5px 8px;border-bottom:1px solid var(--border);
  flex-shrink:0;background:var(--tag-input-bg);align-items:center
}
.tag-search-input,.tag-replace-input{
  flex:1;background:var(--input-bg);border:1px solid var(--border);border-radius:4px;
  color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:10px;
  padding:3px 6px;outline:none;transition:border-color .15s;min-width:0
}
.tag-search-input:focus{border-color:var(--c1)}
.tag-replace-input:focus{border-color:var(--c3)}
.tag-search-input::placeholder,.tag-replace-input::placeholder{color:var(--muted)}
.tag-replace-btn{
  flex-shrink:0;padding:3px 7px;background:var(--surface);border:1px solid var(--c3);
  border-radius:4px;color:var(--c3);font-family:'IBM Plex Mono',monospace;font-size:9px;
  cursor:pointer;transition:all .15s;white-space:nowrap
}
.tag-replace-btn:hover{background:var(--batch-hover-bg)}
.tag-replace-all-btn{
  flex-shrink:0;padding:3px 7px;background:var(--surface);border:1px solid var(--c2);
  border-radius:4px;color:var(--c2);font-family:'IBM Plex Mono',monospace;font-size:9px;
  cursor:pointer;transition:all .15s;white-space:nowrap
}
.tag-replace-all-btn:hover{background:var(--replace-hover-bg)}
.tag-delete-all-btn{
  flex-shrink:0;padding:3px 7px;background:var(--surface);border:1px solid var(--danger);
  border-radius:4px;color:var(--danger);font-family:'IBM Plex Mono',monospace;font-size:9px;
  cursor:pointer;transition:all .15s;white-space:nowrap
}
.tag-delete-all-btn:hover{background:var(--danger-hover-bg);color:var(--danger)}
.search-sep{font-size:9px;color:var(--muted);flex-shrink:0}

/* Current tags list */
.current-tags{padding:6px 8px;overflow-y:auto;flex:1;min-height:36px}
.current-tags::-webkit-scrollbar{width:3px}
.current-tags::-webkit-scrollbar-thumb{background:var(--border)}
.ctag{
  display:inline-flex;align-items:center;gap:3px;background:var(--ctag-bg);
  border:1px solid var(--ctag-border);border-radius:3px;padding:2px 5px 2px 5px;
  margin:2px 2px 2px 0;font-size:9px;color:var(--text);
  -webkit-user-select:none;user-select:none
}
.ctag.highlight{background:var(--added-bg);border-color:var(--added-border);color:var(--added-color)}
.ctag.selected{background:var(--tg-chip-bg);border-color:var(--c5);color:var(--c5)}
.ctag.selectable{cursor:pointer}
.ctag.selectable .ctag-text{cursor:pointer}
.ctag-text{cursor:default;outline-offset:2px}
.ctag-text:hover{text-decoration:underline dotted var(--muted);text-underline-offset:2px}
/* Floating sticky-note tag editor (long-press edit) */
.tag-edit-pop{
  position:fixed;z-index:600;width:320px;max-width:92vw;
  background:var(--modal-bg);border:1px solid var(--c5);border-radius:10px;
  box-shadow:0 14px 44px rgba(0,0,0,.55);padding:10px
}
.tag-edit-area{
  width:100%;min-height:92px;resize:vertical;background:var(--modal-input-bg);
  border:1px solid var(--border);border-radius:6px;color:var(--white);
  font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.6;
  padding:9px 11px;outline:none;box-sizing:border-box;transition:border-color .15s
}
.tag-edit-area:focus{border-color:var(--c5);box-shadow:0 0 0 2px rgba(176,166,204,.15)}
.tag-edit-pop-foot{display:flex;align-items:center;gap:6px;margin-top:8px}
.tag-edit-pop-hint{flex:1;font-size:9px;color:var(--muted);letter-spacing:.04em}
.tag-edit-pop-count{flex:0 0 auto;font-size:9px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.tag-edit-pop-foot button{
  padding:4px 12px;border:none;border-radius:4px;color:#fff;font-size:10px;
  cursor:pointer;font-family:'IBM Plex Mono',monospace;white-space:nowrap
}
.tag-edit-pop-foot .ip-confirm{background:var(--c5)}
.tag-edit-pop-foot .ip-cancel{background:var(--c4)}
.ctag-del{cursor:pointer;color:var(--muted);font-size:11px;font-weight:700;transition:color .1s;line-height:1}
.ctag-del:hover{color:var(--danger)}
.no-tags{font-size:10px;color:var(--muted);font-style:italic;padding:2px 0}

/* Kbd hint */
.kbd-hint{font-size:9px;color:var(--muted);padding:4px 10px 5px;border-top:1px solid var(--border);text-align:center;flex-shrink:0;letter-spacing:.06em}
.kbd{display:inline-block;background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:0 4px;font-size:9px;color:var(--text);font-family:'IBM Plex Mono',monospace}

/* ════════════════════════════════════════════════
   RIGHT PANEL — Gallery
════════════════════════════════════════════════ */
.right-panel{
  flex:1;min-width:var(--gallery-min-w);
  width:auto;max-width:none;
  display:flex;flex-direction:column;overflow:hidden;background:var(--bg)
}

/* Gallery header */
.gallery-header{
  padding:9px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex-shrink:0;background:var(--gallery-header-bg)
}
.gallery-title{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.gallery-title::before{content:'▤';color:var(--c1);font-size:13px}
.gallery-stats{font-size:10px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:12px}
.gstat{display:flex;align-items:center;gap:4px}
.gstat-val{color:var(--text)}
.rows-select{
  background:var(--surface);border:1px solid var(--border);border-radius:4px;
  color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:10px;
  padding:3px 6px;outline:none;cursor:pointer
}
.rows-select:focus{border-color:var(--c1)}

/* Gallery tag search */
.gallery-search-wrap{display:flex;align-items:center;flex:1 1 150px;max-width:280px;min-width:130px;position:relative}
.gallery-search-input{
  width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:4px;
  color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:10px;
  padding:4px 58px 4px 9px;outline:none;transition:border-color .15s
}
.gallery-search-input:focus{border-color:var(--c1)}
.gallery-search-input::placeholder{color:var(--muted)}
.gallery-search-clear{
  position:absolute;right:3px;top:50%;transform:translateY(-50%);
  background:transparent;border:none;color:var(--muted);font-size:13px;font-weight:700;
  cursor:pointer;padding:2px 5px;line-height:1;display:none
}
.gallery-search-clear:hover{color:var(--danger)}

/* Exact / fuzzy search mode toggle (inside search inputs) */
.search-mode-toggle{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  padding:2px 6px;background:var(--surface);border:1px solid var(--border);border-radius:3px;
  color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:8px;cursor:pointer;
  transition:all .15s;white-space:nowrap;line-height:1.4
}
.search-mode-toggle:hover{border-color:var(--c4);color:var(--c4)}
.search-mode-toggle.active{background:var(--c4);border-color:var(--c4);color:var(--white)}

/* Tag Groups Bar (Gallery - removed) */
.tag-groups-bar{
  padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--section-bar-bg)
}

/* Tag Groups Bar (Sidebar) */
.tag-groups-bar-sidebar{
  padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0;
  display:flex;flex-direction:column;gap:6px;background:var(--section-bar-bg)
}
.tag-groups-bar-sidebar .tg-header-row{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  cursor:pointer;user-select:none;padding:2px 0
}
.tag-groups-bar-sidebar .tg-header-row:hover .tag-groups-label{color:var(--white)}
.tag-groups-bar-sidebar .tg-toggle{
  font-size:9px;color:var(--muted);transition:transform .2s
}
.tag-groups-bar-sidebar.collapsed .tg-toggle{transform:rotate(-90deg)}
.tag-groups-bar-sidebar .tg-actions-row{
  display:flex;align-items:center;gap:6px;padding:4px 0
}
.tag-groups-bar-sidebar.collapsed .tg-actions-row{display:none}
.tag-groups-bar-sidebar .tg-chips-wrap{
  display:flex;flex-wrap:wrap;gap:6px;min-width:0;
  transition:all .2s ease
}
.tag-groups-bar-sidebar.collapsed .tg-chips-wrap{display:none}
.tag-groups-bar-sidebar .tg-add-btn{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;
  background:transparent;border:1px solid var(--c5);border-radius:4px;
  color:var(--c5);font-family:'IBM Plex Mono',monospace;font-size:9px;
  cursor:pointer;transition:all .15s;letter-spacing:.05em;white-space:nowrap
}
.tag-groups-bar-sidebar .tg-add-btn:hover{background:rgba(176,166,204,.1)}
.tag-groups-bar-sidebar .tg-chip{
  display:inline-flex;align-items:center;gap:0;background:var(--tg-chip-bg);
  border:1px solid var(--tg-chip-border);border-radius:5px;overflow:hidden;cursor:pointer;
  transition:all .15s;user-select:none;font-size:9px
}
.tag-groups-bar-sidebar .tg-chip:hover{border-color:var(--c5);box-shadow:0 2px 8px rgba(176,166,204,.2)}
.tag-groups-bar-sidebar .tg-chip-body{display:flex;align-items:center;gap:4px;padding:3px 7px 3px 7px}
.tag-groups-bar-sidebar .tg-chip-name{font-weight:600;color:var(--c5);white-space:nowrap}
.tag-groups-bar-sidebar .tg-chip-count{color:var(--muted);font-size:8px}
.tag-groups-bar-sidebar .tg-chip-actions{display:flex;border-left:1px solid var(--tg-chip-border);flex-shrink:0}
.tag-groups-bar-sidebar .tg-chip-edit,.tag-groups-bar-sidebar .tg-chip-del{
  padding:2px 5px;background:transparent;border:none;color:var(--muted);
  font-size:9px;cursor:pointer;transition:color .12s;line-height:1.8
}
.tag-groups-bar-sidebar .tg-chip-edit:hover{color:var(--c3)}
.tag-groups-bar-sidebar .tg-chip-del:hover{color:var(--danger)}
.tag-groups-bar-sidebar .tg-chip.applying{border-color:var(--added-color);background:var(--added-bg);animation:tg-flash .5s ease}

.tag-groups-label{font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}

.tg-chip-edit,.tg-chip-del{

.tg-add-btn{
  flex-shrink:0;display:flex;align-items:center;gap:4px;padding:3px 10px;

/* Gallery Grid */
.gallery-grid{

}

}
.gallery-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center;align-self:stretch;overflow:hidden}

}

.gallery-tags-more{color:var(--muted);opacity:.85;white-space:nowrap}
.gallery-tag-count{

}

}

/* Gallery pagination */
.gallery-pagination{

}

/* ════════════════════════════════════════════════
   TAG SIDEBAR — Right side panel
════════════════════════════════════════════════ */
.tag-sidebar{

.tag-sidebar-search-wrap{

}

.ts-action-btn{

}

.tag-sidebar-body{flex:1;overflow-y:auto;padding:8px 10px}

/* Tag Groups Section */
.ts-section{margin-bottom:16px}
.ts-section-header{
  display:flex;align-items:center;gap:6px;padding:6px 8px;

}
.ts-section-header:hover{border-color:var(--c5)}
.ts-section-header.collapsed{opacity:.7}

.ts-section-content{display:block;transition:all .2s}
.ts-section-content.collapsed{display:none}

/* Tag Group Chips */
.ts-tg-chip{
  display:inline-flex;align-items:center;gap:4px;padding:4px 8px;
  background:var(--tg-chip-bg);border:1px solid var(--tg-chip-border);border-radius:4px;
  margin:3px 3px 3px 0;cursor:pointer;transition:all .15s;font-size:9px;
  color:var(--white);user-select:none
}
.ts-tg-chip:hover{border-color:var(--c5);background:var(--tg-chip-hover-bg)}
.ts-tg-chip:active{transform:scale(.95)}
.ts-tg-chip-name{font-weight:600}
.ts-tg-chip-count{color:var(--muted);font-size:8px}

/* Category Tags */
.ts-cat-section{margin-bottom:12px}
.ts-cat-header{
  display:flex;align-items:center;gap:6px;padding:5px 8px;
  background:var(--tag-bg);border:1px solid var(--border);border-radius:4px;
  margin-bottom:6px;cursor:pointer;transition:all .15s
}
.ts-cat-header:hover{border-color:var(--c3)}
.ts-cat-header.collapsed{opacity:.7}
.ts-cat-title{font-size:9px;font-weight:600;color:var(--c3);flex:1}
.ts-cat-toggle{font-size:9px;color:var(--muted);transition:transform .2s}
.ts-cat-header.collapsed .ts-cat-toggle{transform:rotate(-90deg)}

.ts-cat-content{display:block;transition:all .2s}
.ts-cat-content.collapsed{display:none}

.ts-tag-item{
  display:inline-flex;align-items:center;padding:3px 7px;
  background:var(--tag-bg);border:1px solid var(--border);border-radius:3px;
  margin:2px 2px 2px 0;cursor:pointer;transition:all .12s;font-size:9px;
  color:var(--text);user-select:none
}
.ts-tag-item:hover{background:var(--tag-hover);border-color:var(--c4)}
.ts-tag-item:active{transform:scale(.95)}
.ts-tag-item.added{background:var(--added-bg);border-color:var(--added-border);color:var(--added-color)}

/* Sidebar tag inline edit input (long-press rename) — superseded by tag edit modal */

/* Quick-add chip (＋) at the tail of each category's tags */
.ts-tag-add{position:relative;border-style:dashed;border-color:var(--c3);color:var(--c3);font-weight:600;padding:3px 9px}
.ts-tag-add:hover{background:var(--batch-hover-bg);border-color:var(--c3);color:var(--c3)}
.ts-tag-add .inline-input-popup{bottom:auto;top:calc(100% + 4px)}
.ts-tag-add .inline-input-popup input{width:150px}

/* Gallery Resizer removed */

/* Tag Sidebar Resizer */
.tag-sidebar-resizer{
  width:6px;background:transparent;cursor:ew-resize;z-index:25;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;position:relative
}
.tag-sidebar-resizer::after{
  content:'';width:2px;height:50px;border-radius:2px;
  background:var(--muted);transition:all .15s
}
.tag-sidebar-resizer:hover::after,.tag-sidebar-resizer.dragging::after{background:var(--c5);height:70px}

/* Right panel (gallery) border adjustment when sidebar is on left of it */
.right-panel{
  border-left:1px solid var(--border);
}

/* ════════════════════════════════════════════════
   MODALS & OVERLAYS
════════════════════════════════════════════════ */
.tg-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:500;display:flex;align-items:center;justify-content:center}
.tg-modal-overlay.hidden{display:none}
.tg-modal{background:var(--modal-bg);border:1px solid var(--border);border-radius:10px;width:min(720px,95vw);max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.tg-modal-head{padding:14px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.tg-modal-title{font-size:13px;font-weight:600;color:var(--white);letter-spacing:.06em;flex:1}
.tg-modal-close{width:28px;height:28px;background:transparent;border:1px solid var(--border);border-radius:5px;color:var(--muted);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.tg-modal-close:hover{border-color:var(--danger);color:var(--danger)}
.tg-modal-name-row{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.tg-modal-name-label{font-size:10px;color:var(--muted);letter-spacing:.1em;white-space:nowrap}
.tg-modal-name-input{flex:1;background:var(--modal-input-bg);border:1px solid var(--border);border-radius:5px;color:var(--white);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 10px;outline:none;transition:border-color .15s}
.tg-modal-name-input:focus{border-color:var(--c5)}
.tg-modal-name-input::placeholder{color:var(--muted)}
.tg-modal-search-row{padding:8px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.tg-modal-search{width:100%;background:var(--modal-input-bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 10px;outline:none;transition:border-color .15s}
.tg-modal-search:focus{border-color:var(--c1)}
.tg-modal-search::placeholder{color:var(--muted)}
.tg-modal-body{flex:1;overflow-y:auto;padding:12px 20px}
.tg-modal-body::-webkit-scrollbar{width:4px}
.tg-modal-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tg-selected-summary{
  padding:8px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0
}
.tg-selected-summary-title{
  font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:6px
}
.tg-selected-summary-tags{
  display:flex;flex-wrap:wrap;gap:5px;min-height:24px
}
.tg-summary-tag{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;
  background:var(--tg-chip-bg);border:1px solid var(--c5);border-radius:4px;
  font-size:9px;color:var(--white)
}
.tg-summary-tag .ctag-del{
  cursor:pointer;color:var(--muted);font-size:11px;font-weight:700;transition:color .1s;line-height:1
}
.tg-summary-tag .ctag-del:hover{color:var(--danger)}
.tg-modal-section{margin-bottom:16px}
.tg-modal-sec-title{font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.tg-modal-tags{display:flex;flex-wrap:wrap;gap:6px}
.tg-sel-tag{display:inline-flex;flex-direction:column;gap:1px;padding:5px 9px;background:var(--tag-bg);border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:all .12s;user-select:none}
.tg-sel-tag:hover{background:var(--tag-hover);border-color:var(--c5)}
.tg-sel-tag:active{border-color:var(--c3);background:var(--batch-hover-bg)}
.tg-sel-tag.selected{background:var(--tg-chip-bg);border-color:var(--c5);box-shadow:0 0 0 1px var(--c5)}
.tg-sel-tag-cn{font-family:'Noto Serif SC',serif;font-size:11px;color:var(--white)}
.tg-sel-tag-en{font-size:9px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.tg-sel-tag.selected .tg-sel-tag-cn{color:var(--c5)}
.tg-sel-tag.selected .tg-sel-tag-en{color:var(--c5);opacity:.7}
.tg-modal-foot{padding:10px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.tg-modal-selected-count{flex:1;font-size:10px;color:var(--muted);letter-spacing:.06em}
.tg-modal-selected-count em{color:var(--c5);font-style:normal;font-weight:600}
.tg-modal-cancel{padding:6px 14px;background:transparent;border:1px solid var(--border);border-radius:5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;transition:all .15s}
.tg-modal-cancel:hover{border-color:var(--text);color:var(--text)}
.tg-modal-save{padding:6px 18px;background:rgba(176,166,204,.15);border:1px solid var(--c5);border-radius:5px;color:var(--c5);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;letter-spacing:.06em}
.tg-modal-save:hover{background:rgba(176,166,204,.25)}
.tg-modal-save:disabled{opacity:.35;cursor:default;pointer-events:none}
.tg-sel-all-btn{padding:3px 10px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:9px;cursor:pointer;transition:all .12s;white-space:nowrap}
.tg-sel-all-btn:hover{border-color:var(--c5);color:var(--c5)}

/* Inline popup input */
.inline-input-popup{
  position:absolute;bottom:calc(100% + 4px);left:0;
  display:flex;align-items:center;gap:4px;z-index:20
}
.inline-input-popup input{
  width:220px;padding:5px 10px;background:var(--input-bg);border:1px solid var(--c5);
  border-radius:4px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:11px;outline:none
}
.inline-input-popup button{
  padding:4px 8px;border:none;border-radius:4px;
  color:#fff;font-size:10px;cursor:pointer;white-space:nowrap
}
.inline-input-popup .ip-confirm{background:var(--c5)}
.inline-input-popup .ip-cancel{background:var(--c4)}

/* Toast */
#toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--toast-bg);border:1px solid var(--added-color);color:var(--added-color);
  font-size:11px;font-family:'IBM Plex Mono',monospace;padding:9px 20px;
  border-radius:6px;opacity:0;pointer-events:none;transition:all .25s;
  white-space:nowrap;letter-spacing:.06em;z-index:999
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.warn{border-color:var(--c3);color:var(--c3);background:var(--toast-bg)}
#toast.info{border-color:var(--c4);color:var(--c4);background:var(--toast-bg)}

/* Confirm dialog */
#confirm-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .15s;will-change:opacity;transform:translateZ(0)
}
#confirm-overlay.show{opacity:1;pointer-events:auto}
#confirm-dialog{
  background:var(--panel-bg);border:1px solid var(--c5);border-radius:8px;
  padding:20px 24px;max-width:360px;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text);
  box-shadow:0 8px 32px rgba(0,0,0,.5)
}
#confirm-dialog .confirm-msg{margin:0 0 16px;line-height:1.5}
#confirm-dialog .confirm-btns{display:flex;gap:8px;justify-content:center}
#confirm-dialog .confirm-btns button{
  padding:6px 18px;border:none;border-radius:4px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer
}
#confirm-dialog .confirm-btns .btn-confirm{background:var(--danger);color:#fff}
#confirm-dialog .confirm-btns .btn-cancel{background:var(--c4);color:#fff}

/* Suffix bar */
.suffix-bar{
  padding:7px 12px;border-top:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;gap:8px;background:var(--section-bar-bg)
}
.suffix-label{font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.suffix-input{
  flex:1;background:transparent;border:none;outline:none;
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  color:var(--c1);caret-color:var(--c1)
}
.suffix-input::placeholder{color:var(--muted);font-weight:400}
.suffix-preview{font-size:9px;color:var(--muted);white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.suffix-preview em{color:var(--c4);font-style:normal}

/* Language switcher */
.lang-btn{
  background:transparent;border:1px solid var(--c5);color:var(--c5);
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  cursor:pointer;padding:3px 10px;border-radius:4px;
  transition:all .15s;font-weight:600;letter-spacing:.05em;white-space:nowrap
}
.lang-btn:hover{background:rgba(176,166,204,.1)}
.lang-btn.active{color:var(--c4);border-color:var(--c4);background:rgba(78,158,255,.15)}
</style>

<body>
<div class="main-container">

<!-- ══════════════════ LEFT PANEL ══════════════════ -->
<aside class="left-panel" id="leftPanel">

  <!-- Header row -->
  <div class="panel-header">
    <div class="panel-title" data-i18n="panel.title">图片文件夹</div>
    <button class="import-btn" onclick="importFolder()" data-i18n="import.btn">📂 导入文件夹</button>
    <button class="batch-btn" id="batchBtn" onclick="showBatchPopup(event)" data-i18n="batch.btn">⚡ 批量添加标签</button>
    <div class="panel-stats" id="panelStats" style="display:none">
      <span data-i18n="panel.stats" data-i18n-params='{"count":"<span class=\"stat-val\" id=\"imgCount\">0</span>"}'>共 <span class="stat-val" id="imgCount">0</span> 张</span>
    </div>
  </div>

  <!-- Body: image | tag editing -->
  <div class="panel-body">

    <!-- Image column -->
    <div class="img-col" id="imgCol">
      <!-- Page nav -->
      <div class="page-nav hidden" id="pageNav">
        <div>
          <div class="page-counter"><em id="pageCurrentNum">1</em> / <em id="pageTotalNum">0</em></div>
          <div class="page-filename" id="pageFilename"></div>
        </div>
        <div class="nav-arrows">
          <button class="arrow-btn" id="btnPrev" onclick="navigateImage(-1)" data-i18n-title="page.nav.prev" title="上一张 (A)">←</button>
          <button class="arrow-btn" id="btnNext" onclick="navigateImage(1)" data-i18n-title="page.nav.next" title="下一张 (D)">→</button>
        </div>
      </div>

      <!-- Big image -->

const LANGUAGE_SYNC_MESSAGE = 'web-tools-hub:set-language';
const THEME_SYNC_MESSAGE = 'web-tools-hub:set-theme';
let currentLang = localStorage.getItem('app_language') || 'zh';
let currentTheme = localStorage.getItem('web-tools-hub-theme') || 'dark';

function toggleLanguage() {
  const newLang = currentLang === 'zh' ? 'en' : 'zh';
  switchLanguage(newLang);
}

function switchLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('app_language', lang);

  // Update all elements with data-i18n attribute
  updateI18n();
}

function applyTheme(theme) {
  currentTheme = theme || currentTheme;
  document.documentElement.setAttribute('data-theme', currentTheme);
}

function t(key, params = {}) {
  const text = I18N[currentLang][key] || I18N.zh[key] || key;
  return text.replace(/{(\w+)}/g, (_, param) => params[param] || '');
}

function updateI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const params = el.dataset.i18nParams ? JSON.parse(el.dataset.i18nParams) : {};
    el.innerHTML = t(key, params);
  });
  
  // Update placeholders
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    el.placeholder = t(key);
  });
  
  // Update titles
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const key = el.dataset.i18nTitle;
    el.title = t(key);
  });

  updateSaveGroupBtn();

  syncSearchModeBtn('tagSidebarSearchModeBtn', SIDEBAR_SEARCH_MODE_KEY);
  syncSearchModeBtn('gallerySearchModeBtn', GALLERY_SEARCH_MODE_KEY);
}

const INSERT_MODE_KEY = 'tag_tool_insert_mode';
const INPUTS_STATE_KEY = 'tag_tool_inputs_state';
let tagInsertMode = localStorage.getItem(INSERT_MODE_KEY) === 'prepend' ? 'prepend' : 'append';

function setInsertMode(mode) {
  if (mode !== 'append' && mode !== 'prepend') return;
  tagInsertMode = mode;
  localStorage.setItem(INSERT_MODE_KEY, mode);
  $('insertModeAppend').classList.toggle('active', mode === 'append');
  $('insertModePrepend').classList.toggle('active', mode === 'prepend');
}

function insertTag(item, tag) {
  if (tagInsertMode === 'prepend') item.tags.unshift(tag);
  else item.tags.push(tag);
}

function insertTags(item, tags) {
  if (tagInsertMode === 'prepend') item.tags.unshift(...tags);
  else item.tags.push(...tags);
}

// ─── Init ──────────────────────────────────────────────────
const PERSISTED_INPUT_IDS = ['tagManualInput', 'tagSearchInput', 'tagReplaceInput', 'charidInput'];

function loadInputsState() {
  try {
    const raw = localStorage.getItem(INPUTS_STATE_KEY);
    if (!raw) return;
    const map = JSON.parse(raw);
    for (const id of PERSISTED_INPUT_IDS) {
      if (typeof map[id] === 'string' && $(id)) $(id).value = map[id];
    }
  } catch {}
}

function saveInputsState() {
  try {
    const map = {};
    for (const id of PERSISTED_INPUT_IDS) {
      if ($(id)) map[id] = $(id).value;
    }
    localStorage.setItem(INPUTS_STATE_KEY, JSON.stringify(map));
  } catch {}
}

document.addEventListener('DOMContentLoaded', () => {
  tgLoad();
  catLoad();
  renderTagGroups();
  renderTagSidebar();

  // Restore insert mode toggle UI
  setInsertMode(tagInsertMode);

  // Restore persisted input values
  loadInputsState();
  // Refresh suffix preview if charidInput was restored
  const restoredSuffix = $('charidInput').value.trim();
  if (restoredSuffix) {
    $('charidPreview').innerHTML = `${t('suffix.preview.prefix')}<em>${restoredSuffix}</em>`;
  }

  // Initialize language
  switchLanguage(currentLang);

  // Initialize search mode toggle buttons
  syncSearchModeBtn('tagSidebarSearchModeBtn', SIDEBAR_SEARCH_MODE_KEY);
  syncSearchModeBtn('gallerySearchModeBtn', GALLERY_SEARCH_MODE_KEY);

  // Initialize theme
  applyTheme();

  window.addEventListener('message', event => {
    if (event.data?.type === LANGUAGE_SYNC_MESSAGE) {
      const nextLang = event.data?.language === 'en' ? 'en' : 'zh';
      if (currentLang === nextLang) return;
      switchLanguage(nextLang);
    }
    if (event.data?.type === THEME_SYNC_MESSAGE) {
      applyTheme(event.data.theme);
    }
  });

  $('charidInput').addEventListener('input', () => {
    const v = $('charidInput').value.trim();
    $('charidPreview').innerHTML = v
      ? `${t('suffix.preview.prefix')}<em>${v}</em>`
      : t('suffix.preview');
    saveInputsState();
  });

  for (const id of ['tagManualInput', 'tagSearchInput', 'tagReplaceInput']) {
    $(id).addEventListener('input', saveInputsState);
  }

  $('tagManualInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addManualTags(); }
  });

  // Enter in gallery search: select the first matching image
  $('gallerySearchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const list = getGalleryFilteredList();
      if (list.length > 0) selectImage(imageFiles.indexOf(list[0]));
    }
  });

  // Big image zoom: wheel anchored at cursor
  $('bigImageWrap').addEventListener('wheel', e => {
    if (!imgZoom.img) return;
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const newScale = Math.min(12, Math.max(0.2, imgZoom.scale * factor));
    if (newScale === imgZoom.scale) return;
    const wrapRect = $('bigImageWrap').getBoundingClientRect();
    // 鼠标相对图片未变换左上角的偏移
    const bx = (e.clientX - wrapRect.left) - imgZoom.img.offsetLeft;
    const by = (e.clientY - wrapRect.top) - imgZoom.img.offsetTop;
    const k = newScale / imgZoom.scale;
    // 以鼠标为锚点:鼠标处的图像点在缩放前后保持不动
    imgZoom.tx = bx * (1 - k) + imgZoom.tx * k;
    imgZoom.ty = by * (1 - k) + imgZoom.ty * k;
    imgZoom.scale = newScale;
    applyImgZoom();
  }, { passive: false });

  // Big image zoom: drag to pan
  document.addEventListener('mousemove', e => {
    if (!imgDrag || !imgZoom.img) return;
    imgZoom.tx = imgDrag.tx + (e.clientX - imgDrag.sx);
    imgZoom.ty = imgDrag.ty + (e.clientY - imgDrag.sy);
    applyImgZoom();
  });
  document.addEventListener('mouseup', () => {
    if (imgDrag && imgZoom.img && imgZoom.scale !== 1) imgZoom.img.style.cursor = 'grab';
    imgDrag = null;
  });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (imageFiles.length === 0) return;
    if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') { e.preventDefault(); navigateImage(-1); }
    else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') { e.preventDefault(); navigateImage(1); }
  });

  // Close inline popup on click outside.
  // Uses capture-phase mousedown so clicks inside modals (which stop
  // click propagation) still close the popup, and goes through
  // closeInlinePopup() so the opener button's onclick is restored —
  // plain popup.remove() left the button dead after cancelling.
  document.addEventListener('mousedown', e => {
    const popup = document.querySelector('.inline-input-popup');
    if (popup && !popup.contains(e.target)) closeInlinePopup();
    // 点击便利贴编辑框外部时取消
    const pop = $('tagEditPop');
    if (pop && pop.style.display !== 'none' && !pop.contains(e.target)) {
      // 长按打开编辑框后，浏览器可能补发打在原标签上的合成 mousedown，此刻忽略，避免把刚打开的框直接关掉
      if (tagEditJustOpened) { tagEditJustOpened = false; return; }
      closeTagEdit(false);
    }
  }, true);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const overlay = $('tgModalOverlay');
      if (!overlay.classList.contains('hidden')) { e.stopPropagation(); closeTgModal(); }
      closeInlinePopup();
      closeTagEdit(false);
    }
  });

  $('tgModalNameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); saveTgGroup(); }
  });

  initColResizer();
  initRightPanelResizer();
  initTagSidebarResizer();
  initGalleryResizer();
});

// ─── Column resizer ────────────────────────────────────────
function initColResizer() {
  const resizer = $('colResizer');
  const imgCol  = $('imgCol');
  let dragging = false, startX = 0, startW = 0;
  const minW = 120;
  const maxW = 760;

  resizer.addEventListener('mousedown', e => {
    dragging = true; startX = e.clientX; startW = imgCol.offsetWidth;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'ew-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const w = Math.max(minW, Math.min(startW + e.clientX - startX, maxW));
    imgCol.style.width = w + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
}

// ─── Main panel resizer (between left and right) ───────
function initRightPanelResizer() {
  const resizer = $('mainPanelResizer');
  const leftPanel = $('leftPanel');
  const tagSidebar = $('tagSidebar');
  const tagSidebarResizer = $('tagSidebarResizer');
  let dragging = false, startX = 0, startLeftW = 0;
  const minW = 320;
  const hardMaxW = 1400;
  const minGalleryW = 260;

  resizer.addEventListener('mousedown', e => {
    dragging = true;
    startX = e.clientX;
    startLeftW = leftPanel.offsetWidth;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'ew-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const mainContainer = document.querySelector('.main-container');
    const containerW = mainContainer ? mainContainer.clientWidth : window.innerWidth;
    const occupiedRightW = tagSidebar.offsetWidth + tagSidebarResizer.offsetWidth + minGalleryW;
    const dynamicMaxW = Math.max(minW, Math.min(hardMaxW, containerW - resizer.offsetWidth - occupiedRightW));
    const newLeftW = Math.max(minW, Math.min(startLeftW + e.clientX - startX, dynamicMaxW));
    leftPanel.style.width = newLeftW + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
}

// ─── Gallery Resizer removed ───────────────────────────────
function initGalleryResizer() {}

// ─── Tag Sidebar Resizer ────────────────────────────────────────
function initTagSidebarResizer() {
  const resizer = $('tagSidebarResizer');
  const tagSidebar = $('tagSidebar');
  const leftPanel = $('leftPanel');
  const mainPanelResizer = $('mainPanelResizer');
  const rightPanel = $('rightPanel');
  let dragging = false, startX = 0, startTagW = 0;
  const minW = 160;
  const hardMaxW = 720;
  const minGalleryW = 260;

  resizer.addEventListener('mousedown', e => {
    dragging = true;
    startX = e.clientX;
    startTagW = tagSidebar.offsetWidth;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'ew-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const mainContainer = document.querySelector('.main-container');
    const containerW = mainContainer ? mainContainer.clientWidth : window.innerWidth;
    const occupiedW = leftPanel.offsetWidth + mainPanelResizer.offsetWidth + resizer.offsetWidth;
    const dynamicMaxW = Math.max(minW, Math.min(hardMaxW, containerW - occupiedW - minGalleryW));
    const nextW = startTagW + (e.clientX - startX);
    const newTagW = Math.max(minW, Math.min(nextW, dynamicMaxW));
    tagSidebar.style.width = newTagW + 'px';
    rightPanel.style.minWidth = minGalleryW + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
}

// ─── Import folder ─────────────────────────────────────────
async function importFolder() {
  if (!window.showDirectoryPicker) {
    showToast(t('toast.import.warn'), 'warn', 4000);
    return;
  }
  try {
    folderHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
  } catch (e) {
    if (e.name !== 'AbortError') showToast(t('toast.import.warn2') + ' ' + e.message, 'warn');
    return;
  }

  imageFiles = [];
  const txtMap = {};

  for await (const [name, handle] of folderHandle.entries()) {
    if (handle.kind !== 'file') continue;
    const ext = name.split('.').pop().toLowerCase();
    if (ext === 'txt') { txtMap[name.slice(0, -(ext.length+1))] = handle; }
  }
  for await (const [name, handle] of folderHandle.entries()) {
    if (handle.kind !== 'file') continue;
    const ext = name.split('.').pop().toLowerCase();
    if (!IMG_EXTS.includes(ext) && !VIDEO_EXTS.includes(ext)) continue;
    const base = name.slice(0, -(ext.length+1));
    imageFiles.push({ name, base, imgHandle: handle, txtHandle: txtMap[base] || null, tags: [], objUrl: null });
  }

  imageFiles.sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  for (const item of imageFiles) {
    if (item.txtHandle) item.tags = await readTags(item.txtHandle);
  }

  $('panelStats').style.display = 'flex';
  $('imgCount').textContent = imageFiles.length;
  $('galleryTotal').textContent = imageFiles.length;
  $('pageTotalNum').textContent = imageFiles.length;
  $('batchBtn').style.display = 'flex';

  showToast(t('toast.import.success', {count: imageFiles.length}), 'info');

  galleryPage = 1;
  renderGallery();

  if (imageFiles.length > 0) { selectedIdx = 0; renderPreview(); }
}

// ─── Read tags ─────────────────────────────────────────────
async function readTags(handle) {
  try {
    const file = await handle.getFile();
    const text = await file.text();
    return text.split(',').map(t => t.trim()).filter(Boolean);
  } catch { return []; }
}

// 生成视频首帧图片（data URL），用作未播放时的海报与画廊缩略图
async function videoPosterDataUrl(file, maxDimension = 320) {
  const objectUrl = URL.createObjectURL(file);
  try {
    const video = document.createElement('video');
    video.muted = true;
    video.playsInline = true;
    video.preload = 'auto';
    video.src = objectUrl;
    await new Promise((resolve, reject) => {
      video.onloadeddata = resolve;
      video.onerror = () => reject(new Error('video'));
    });
    // 跳到 0.1s（或时长的 10%），避免取到黑首帧
    const target = video.duration ? Math.min(0.1, video.duration * 0.1) : 0;
    if (target > 0) {
      await new Promise((resolve) => {
        video.onseeked = resolve;
        video.currentTime = target;
      });
    }
    const ratio = Math.min(1, maxDimension / video.videoWidth, maxDimension / video.videoHeight);
    const w = Math.max(1, Math.round(video.videoWidth * ratio));
    const h = Math.max(1, Math.round(video.videoHeight * ratio));
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(video, 0, 0, w, h);
    return canvas.toDataURL('image/jpeg', 0.8);
  } finally {
    URL.revokeObjectURL(objectUrl);
  }
}

// ─── Navigate ──────────────────────────────────────────────
function navigateImage(delta) {
  if (imageFiles.length === 0) return;
  selectedIdx = ((selectedIdx < 0 ? 0 : selectedIdx) + delta + imageFiles.length) % imageFiles.length;
  // also jump gallery page (based on position in the filtered list)
  const rowsPP = galleryRowsPage;
  const pos = getGalleryFilteredList().indexOf(imageFiles[selectedIdx]);
  if (pos >= 0) {
    const targetPage = Math.floor(pos / rowsPP) + 1;
    if (targetPage !== galleryPage) {
      galleryPage = targetPage;
      renderGallery();
    } else {
      updateGalleryActive();
    }
  } else {
    updateGalleryActive();
  }
  renderPreview();
}

// 仅更新画廊行的选中高亮(避免整页重建带来的迟缓)
function updateGalleryActive() {
  $('galleryGrid').querySelectorAll('.gallery-row').forEach(r => {
    r.classList.toggle('active', Number(r.dataset.idx) === selectedIdx);
  });
}

function selectImage(idx) {
  selectedIdx = idx;
  renderPreview();
  // 性能:仅切换高亮行,不重建整个画廊
  updateGalleryActive();
}

// ─── Big image zoom (wheel anchored at cursor) ─────────────
let imgZoom = { scale: 1, tx: 0, ty: 0, img: null };
let imgDrag = null;

function applyImgZoom() {
  const img = imgZoom.img;
  if (!img) return;
  img.style.transformOrigin = '0 0';
  img.style.transform = `translate(${imgZoom.tx}px, ${imgZoom.ty}px) scale(${imgZoom.scale})`;
  img.style.cursor = (imgZoom.scale !== 1) ? 'grab' : '';
  const btn = $('imgZoomResetBtn');
  if (btn) btn.textContent = `⟲ ${Math.round(imgZoom.scale * 100)}%`;
}

function resetImgZoom() {
  imgZoom.scale = 1; imgZoom.tx = 0; imgZoom.ty = 0;
  applyImgZoom();
}

function initImgZoom(img) {
  imgZoom = { scale: 1, tx: 0, ty: 0, img };
  applyImgZoom();
  // 双击重置
  img.addEventListener('dblclick', () => resetImgZoom());
  // 拖拽平移
  img.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    imgDrag = { sx: e.clientX, sy: e.clientY, tx: imgZoom.tx, ty: imgZoom.ty };
    img.style.cursor = 'grabbing';
    e.preventDefault();
  });
}

// ─── Tag edit floating sticky (shared by all long-press edits) ──
let tagEditSubmit = null;
let tagEditJustOpened = false;

function updateTagEditCount() {
  const area = $('tagEditArea');
  const counter = $('tagEditCount');
  if (area && counter) counter.textContent = area.value.length + '/' + area.maxLength;
}

function openTagEditModal(value, onSubmit, anchorEl) {
  tagEditSubmit = onSubmit;
  const pop = $('tagEditPop');
  const area = $('tagEditArea');
  area.value = value;
  pop.style.display = 'block';
  // 长按触发刚打开，忽略紧随其后的合成 mousedown，避免一打开就被"框外点击"关闭
  tagEditJustOpened = true;
  setTimeout(() => { tagEditJustOpened = false; }, 700);

  // 锚定在长按的标签附近（便利贴浮框，自动防溢出）
  if (anchorEl && anchorEl.getBoundingClientRect) {
    const r = anchorEl.getBoundingClientRect();
    const w = Math.min(320, window.innerWidth * 0.92);
    const h = 190; // 浮框预估高度
    let left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
    let top = r.bottom + 6;
    if (top + h > window.innerHeight) top = Math.max(8, r.top - h - 6);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  }

  setTimeout(() => { area.focus(); area.select(); }, 30);
  updateTagEditCount();
}

function closeTagEdit(commit) {
  const pop = $('tagEditPop');
  if (pop.style.display === 'none') return;
  pop.style.display = 'none';
  const fn = tagEditSubmit;
  tagEditSubmit = null;
  if (commit && fn) fn($('tagEditArea').value.replace(/\s*\n\s*/g, ' ').trim());
}

// ─── Render preview ────────────────────────────────────────
async function renderPreview() {
  if (selectedIdx < 0 || imageFiles.length === 0) return;
  const item = imageFiles[selectedIdx];
  // 切换图片时清空标签选择
  ctagSelected.clear();

  $('pageNav').classList.remove('hidden');
  $('pageCurrentNum').textContent = selectedIdx + 1;
  $('pageTotalNum').textContent = imageFiles.length;
  $('pageFilename').textContent = item.name;
  $('btnPrev').disabled = false;
  $('btnNext').disabled = false;

  const wrap = $('bigImageWrap');
  wrap.classList.remove('empty-wrap');
  wrap.innerHTML = '';

  const ext = item.name.split('.').pop().toLowerCase();
  if (VIDEO_EXTS.includes(ext)) {
    const video = document.createElement('video');
    video.className = 'big-video';
    video.controls = true;
    video.playsInline = true;
    video.preload = 'metadata';
    video.title = item.name;
    wrap.innerHTML = '';
    wrap.appendChild(video);
    wrap.classList.remove('empty-wrap');
    imgZoom.img = null;
    $('imgZoomBar').style.display = 'none';
    $('detailFilename').textContent = item.base + '.txt';
    renderCurrentTags();
    try {
      const file = await item.imgHandle.getFile();
      if (!item.objUrl) item.objUrl = URL.createObjectURL(file);
      if (item.objUrl) video.src = item.objUrl;
      // 生成首帧海报，确保未播放时也能看到预览画面
      if (!item.thumbUrl) item.thumbUrl = await videoPosterDataUrl(file);
      if (item.thumbUrl) video.poster = item.thumbUrl;
    } catch {
      // 读取/解码失败则保留控制条，用户仍可尝试播放
    }
    return;
  }

  const img = document.createElement('img');
  img.className = 'big-img';
  img.alt = item.name;
  img.style.opacity = '0';
  wrap.appendChild(img);
  initImgZoom(img);
  $('imgZoomBar').style.display = 'flex';
  try {
    if (!item.objUrl) {
      const file = await item.imgHandle.getFile();
      item.objUrl = URL.createObjectURL(file);
    }
    img.src = item.objUrl;
    img.onload = () => { img.style.opacity = '1'; };
  } catch {
    wrap.innerHTML = '<div class="big-img-placeholder">⚠️</div><div class="big-img-hint">图片加载失败</div>';
    wrap.classList.add('empty-wrap');
    imgZoom.img = null;
    $('imgZoomBar').style.display = 'none';
  }

  $('detailFilename').textContent = item.base + '.txt';
  renderCurrentTags();
}

// ─── Render current tags ───────────────────────────────────
function renderCurrentTags() {
  if (selectedIdx < 0) return;
  const item = imageFiles[selectedIdx];
  const container = $('currentTagsDisplay');
  container.innerHTML = '';
  const keyword = $('tagSearchInput').value.trim().toLowerCase();

  if (item.tags.length === 0) {
    container.innerHTML = `<span class="no-tags">${t('current.tags.empty')}</span>`;
    updateSaveGroupBtn();
    return;
  }
  item.tags.forEach((tag, ti) => {
    const matched = keyword && tag.toLowerCase().includes(keyword);
    const selected = ctagSelectMode && ctagSelected.has(tag);
    const span = document.createElement('span');
    span.className = 'ctag' + (matched ? ' highlight' : '') + (selected ? ' selected' : '') + (ctagSelectMode ? ' selectable' : '');
    if (ctagSelectMode) {
      // 选择模式：点击标签切换选中，用于保存为标签组
      span.title = t('tag.select.hint');
      span.innerHTML = `<span class="ctag-text">${escHtml(tag)}</span><span class="ctag-del" title="${t('toast.remove.success')}" onclick="event.stopPropagation();removeTag(${ti})">×</span>`;
      span.onclick = () => toggleCtagSelected(tag);
    } else {
      span.innerHTML = `<span class="ctag-text" title="${t('toast.tag.edit.hint')}">${escHtml(tag)}</span><span class="ctag-del" data-i18n-title="toast.remove.success" title="${t('toast.remove.success')}" onclick="removeTag(${ti})">×</span>`;
      // 长按编辑（标签旁浮出便利贴输入框）
      const textEl = span.querySelector('.ctag-text');
      bindLongPress(textEl, () => editTag(ti, textEl));
    }
    container.appendChild(span);
  });
  updateSaveGroupBtn();
}

// ─── Current tags selection → save as tag group ───────────
let ctagSelectMode = false;
const ctagSelected = new Set();

function toggleCtagSelectMode(force) {
  ctagSelectMode = (typeof force === 'boolean') ? force : !ctagSelectMode;
  if (!ctagSelectMode) ctagSelected.clear();
  $('ctagSelectToggle').classList.toggle('active', ctagSelectMode);
  renderCurrentTags();
}

function toggleCtagSelected(tag) {
  if (ctagSelected.has(tag)) ctagSelected.delete(tag);
  else ctagSelected.add(tag);
  renderCurrentTags();
}

function updateSaveGroupBtn() {
  const btn = $('saveGroupBtn');
  if (!btn) return;
  const show = ctagSelectMode && ctagSelected.size > 0;
  btn.style.display = show ? 'inline-flex' : 'none';
  btn.textContent = `${t('tag.save.group.btn')} (${ctagSelected.size})`;
}

// ─── Tag search mode (exact / fuzzy) ───────────────────────
const SIDEBAR_SEARCH_MODE_KEY = 'tag_tool_search_mode_sidebar';
const GALLERY_SEARCH_MODE_KEY = 'tag_tool_search_mode_gallery';

// 默认精确匹配（localStorage 存 'fuzzy' 时为模糊）
function isExactSearchMode(key) { return localStorage.getItem(key) !== 'fuzzy'; }

function syncSearchModeBtn(btnId, key) {
  const btn = $(btnId);
  if (!btn) return;
  const exact = isExactSearchMode(key);
  btn.textContent = exact ? t('search.mode.exact') : t('search.mode.fuzzy');
  btn.title = exact ? t('search.mode.exact.title') : t('search.mode.fuzzy.title');
  btn.classList.toggle('active', exact);
}

function onToggleSidebarSearchMode() {
  localStorage.setItem(SIDEBAR_SEARCH_MODE_KEY, isExactSearchMode(SIDEBAR_SEARCH_MODE_KEY) ? 'fuzzy' : 'exact');
  syncSearchModeBtn('tagSidebarSearchModeBtn', SIDEBAR_SEARCH_MODE_KEY);
  onTagSidebarSearch();
}

function onToggleGallerySearchMode() {
  localStorage.setItem(GALLERY_SEARCH_MODE_KEY, isExactSearchMode(GALLERY_SEARCH_MODE_KEY) ? 'fuzzy' : 'exact');
  syncSearchModeBtn('gallerySearchModeBtn', GALLERY_SEARCH_MODE_KEY);
  onGallerySearch();
}

// ─── Gallery rendering ─────────────────────────────────────
function getGalleryFilteredList() {
  const input = $('gallerySearchInput');
  const raw = input ? input.value.trim().toLowerCase() : '';
  if (!raw) return imageFiles;
  // 逗号分隔多个关键词，全部匹配（AND）
  const kws = raw.split(',').map(s => s.trim()).filter(Boolean);
  if (kws.length === 0) return imageFiles;
  if (isExactSearchMode(GALLERY_SEARCH_MODE_KEY)) {
    // 精确：图片需包含每个关键词对应的完全一致标签
    return imageFiles.filter(item => {
      const tags = item.tags.map(tg => tg.toLowerCase());
      return kws.every(k => tags.includes(k));
    });
  }
  // 模糊：子串匹配
  return imageFiles.filter(item => {
    const tags = item.tags.map(tg => tg.toLowerCase());
    return kws.every(k => tags.some(tg => tg.includes(k)));
  });
}

function onGallerySearch() {
  galleryPage = 1;
  const clearBtn = $('gallerySearchClear');
  if (clearBtn) clearBtn.style.display = $('gallerySearchInput').value ? 'block' : 'none';
  renderGallery();
}

function clearGallerySearch() {
  $('gallerySearchInput').value = '';
  onGallerySearch();
}

function renderGallery() {
  const grid = $('galleryGrid');
  const filtering = ($('gallerySearchInput').value || '').trim() !== '';
  const list = filtering ? getGalleryFilteredList() : imageFiles;
  const totalAll = imageFiles.length;
  $('galleryTotal').textContent = filtering ? `${list.length}/${totalAll}` : `${totalAll}`;

  if (totalAll === 0) {
    grid.innerHTML = `<div class="gallery-empty"><span class="icon">📂</span>${t('gallery.empty')}</div>`;
    updateGalleryPagination(0,0);
    return;
  }
  if (list.length === 0) {
    grid.innerHTML = `<div class="gallery-empty"><span class="icon">🔍</span>${t('gallery.search.noresults')}</div>`;
    updateGalleryPagination(0,0);
    return;
  }

  const idxMap = new Map(imageFiles.map((it, i) => [it, i]));
  const rowsPP = galleryRowsPage;
  const totalPages = Math.max(1, Math.ceil(list.length / rowsPP));
  if (galleryPage > totalPages) galleryPage = totalPages;

  const start = (galleryPage - 1) * rowsPP;
  const end   = Math.min(start + rowsPP, list.length);
  const slice = list.slice(start, end);

  grid.innerHTML = '';
  slice.forEach(item => {
    const globalIdx = idxMap.get(item);
    const row = document.createElement('div');
    row.className = 'gallery-row' + (globalIdx === selectedIdx ? ' active' : '');
    row.dataset.idx = globalIdx;
    row.onclick = () => {
      selectImage(globalIdx);
    };

    // Thumbnail
    let thumbHtml;
    const ext = item.name.split('.').pop().toLowerCase();
    if (VIDEO_EXTS.includes(ext)) {
      thumbHtml = `<div class="gallery-thumb-placeholder">🎬</div>`;
      // 异步生成视频首帧缩略图（缓存到 item.thumbUrl）
      requestAnimationFrame(async () => {
        try {
          const file = await item.imgHandle.getFile();
          if (!item.objUrl) item.objUrl = URL.createObjectURL(file);
          if (!item.thumbUrl) item.thumbUrl = await videoPosterDataUrl(file);
          const ph = row.querySelector('.gallery-thumb-placeholder');
          if (ph && item.thumbUrl) {
            const img = document.createElement('img');
            img.className = 'gallery-thumb';
            img.src = item.thumbUrl;
            img.alt = escHtml(item.name);
            img.loading = 'lazy';
            ph.replaceWith(img);
          }
        } catch {
          // 解码失败则保留 🎬 徽标
        }
      });
    } else if (item.objUrl) {
      thumbHtml = `<img class="gallery-thumb" src="${item.objUrl}" alt="${escHtml(item.name)}" loading="lazy">`;
    } else {
      thumbHtml = `<div class="gallery-thumb-placeholder">🖼</div>`;
      // lazy-load thumbnail
      requestAnimationFrame(async () => {
        if (!item.objUrl) {
          try {
            const file = await item.imgHandle.getFile();
            item.objUrl = URL.createObjectURL(file);
          } catch {}
        }
        const thumbEl = row.querySelector('.gallery-thumb-placeholder');
        if (thumbEl && item.objUrl) {
          const img = document.createElement('img');
          img.className = 'gallery-thumb';
          img.src = item.objUrl;
          img.alt = escHtml(item.name);
          img.loading = 'lazy';
          thumbEl.replaceWith(img);
        }
      });
    }

    const tagPreview = item.tags.length > 0
      ? item.tags.slice(0, 6).map(t => `<em>${escHtml(t)}</em>`).join(', ') + (item.tags.length > 6 ? ` <span class="gallery-tags-more">+${item.tags.length - 6}</span>` : '')
      : `<span style="color:var(--muted);font-style:italic">${t('gallery.tags.empty')}</span>`;

    row.innerHTML = thumbHtml +
      `<div class="gallery-info">
        <div class="gallery-name">${escHtml(item.name)}</div>
        <div class="gallery-tags">${tagPreview}</div>
      </div>
      <div class="gallery-tag-count">${item.tags.length} tags</div>`;

    grid.appendChild(row);
  });

  updateGalleryPagination(galleryPage, totalPages);
}

function updateGalleryRow(idx) {
  if (idx < 0 || idx >= imageFiles.length) return;
  const row = $('galleryGrid').querySelector(`.gallery-row[data-idx="${idx}"]`);
  if (!row) return;
  const item = imageFiles[idx];
  const tagsEl = row.querySelector('.gallery-tags');
  const countEl = row.querySelector('.gallery-tag-count');
  if (tagsEl) {
    if (item.tags.length === 0) {
      tagsEl.innerHTML = `<span style="color:var(--muted);font-style:italic">${t('gallery.tags.empty')}</span>`;
    } else {
      tagsEl.innerHTML = item.tags.slice(0, 6).map(tg => `<em>${escHtml(tg)}</em>`).join(', ')
        + (item.tags.length > 6 ? ` <span class="gallery-tags-more">+${item.tags.length - 6}</span>` : '');
    }
  }
  if (countEl) countEl.textContent = `${item.tags.length} tags`;
}

function updateGalleryPagination(current, total) {
  $('gpCurrent').textContent = current || 1;
  $('gpTotal').textContent   = total  || 1;
  $('gpPrev').disabled = current <= 1;
  $('gpNext').disabled = current >= total;
}

function galleryPageDelta(delta) {
  const total = Math.max(1, Math.ceil(getGalleryFilteredList().length / galleryRowsPage));
  galleryPage = Math.max(1, Math.min(galleryPage + delta, total));
  renderGallery();
}

function onRowsChange() {
  galleryRowsPage = parseInt($('rowsSelect').value) || 50;
  galleryPage = 1;
  renderGallery();
}

// ─── Manual add tags ───────────────────────────────────────
async function addManualTags() {
  if (selectedIdx < 0 || !folderHandle) {
    showToast(t('toast.select.warn'), 'warn', 2000);
    return;
  }
  const raw = $('tagManualInput').value;
  if (!raw.trim()) return;
  const suffix = getSuffix();
  const newTags = raw.split(',').map(t => t.trim()).filter(Boolean);
  if (newTags.length === 0) return;

  const item = imageFiles[selectedIdx];
  let added = 0, skipped = 0;
  for (const t of newTags) {
    const fullTag = t + suffix;
    if (item.tags.includes(fullTag)) { skipped++; }
    else { insertTag(item, fullTag); added++; }
  }
  if (added > 0) {
    try {
      await saveTags(item);
      renderCurrentTags();
      updateGalleryRow(selectedIdx);
      const skipText = skipped > 0 ? t('toast.add.skip', {skipped}) : '';
      showToast(t('toast.add.success', {added, skipped: skipText}), 'info', 2200);
    } catch {}
  } else {
    showToast(t('toast.add.all.skip', {skipped}), 'warn', 2000);
  }

// ─── Replace tag ───────────────────────────────────────────
async function replaceTag() {
  if (selectedIdx < 0 || !folderHandle) { showToast(t('toast.select.warn'),'warn',2000); return; }
  const searchVal  = $('tagSearchInput').value.trim();
  const replaceVal = $('tagReplaceInput').value.trim();
  if (!searchVal) { showToast(t('toast.replace.warn'),'warn',2000); return; }

  const item = imageFiles[selectedIdx];
  const kw = searchVal.toLowerCase();
  let count = 0;
  item.tags = item.tags.map(t => {
    if (t.toLowerCase().includes(kw)) {
      count++;
      return t.toLowerCase() === kw ? (replaceVal || t) : t.replace(new RegExp(searchVal.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), replaceVal);
    }
    return t;
  });
  if (!replaceVal) item.tags = item.tags.filter(Boolean);

  if (count > 0) {
    try { await saveTags(item); renderCurrentTags(); updateGalleryRow(selectedIdx); showToast(t('toast.replace.success', {count}),'info',2200); }
    catch {}
  } else {
    showToast(t('toast.replace.notfound'),'warn',2000);
  }
}

async function replaceTagAll() {
  if (!folderHandle || imageFiles.length === 0) { showToast(t('toast.batch.warn'),'warn',2000); return; }
  const searchVal  = $('tagSearchInput').value.trim();
  const replaceVal = $('tagReplaceInput').value.trim();
  if (!searchVal) { showToast(t('toast.replace.warn'),'warn',2000); return; }

  const kw = searchVal.toLowerCase();
  let totalReplaced = 0, filesAffected = 0, errorCount = 0;

  for (const item of imageFiles) {
    let count = 0;
    item.tags = item.tags.map(t => {
      if (t.toLowerCase().includes(kw)) {
        count++;
        return t.toLowerCase() === kw ? (replaceVal || t) : t.replace(new RegExp(searchVal.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), replaceVal);
      }
      return t;
    });
    if (!replaceVal) item.tags = item.tags.filter(Boolean);
    if (count > 0) {
      totalReplaced += count;
      try { await saveTags(item); filesAffected++; } catch { errorCount++; }
    }
  }

  if (selectedIdx >= 0) renderCurrentTags();
  renderGallery();

  if (totalReplaced === 0) showToast(t('toast.replace.all.notfound'),'warn',2500);
  else if (errorCount === 0) showToast(t('toast.replace.all.success', {files: filesAffected, count: totalReplaced}),'info',3000);
  else showToast(t('toast.replace.all.partial', {files: filesAffected, error: errorCount}),'warn',3500);
}

// ─── Delete tag all ────────────────────────────────────────
async function deleteTagAll() {
  if (!folderHandle || imageFiles.length === 0) { showToast(t('toast.batch.warn'),'warn',2000); return; }
  const searchVal = $('tagSearchInput').value.trim();
  if (!searchVal) { showToast(t('toast.replace.warn'),'warn',2000); return; }
  
  if (!await showConfirm(t('toast.delete.confirm', {tag: searchVal}))) return;

  const kw = searchVal.toLowerCase();
  let totalDeleted = 0, filesAffected = 0, errorCount = 0;

  for (const item of imageFiles) {
    const originalLength = item.tags.length;
    item.tags = item.tags.filter(t => !t.toLowerCase().includes(kw));
    const deletedCount = originalLength - item.tags.length;
    
    if (deletedCount > 0) {
      totalDeleted += deletedCount;
      try { await saveTags(item); filesAffected++; } catch { errorCount++; }
    }
  }

  if (selectedIdx >= 0) renderCurrentTags();
  renderGallery();

  if (totalDeleted === 0) showToast(t('toast.delete.notfound'),'warn',2500);
  else if (errorCount === 0) showToast(t('toast.delete.success', {files: filesAffected, count: totalDeleted}),'info',3000);
  else showToast(t('toast.delete.partial', {files: filesAffected, error: errorCount}),'warn',3500);
}

// ─── Remove tag ────────────────────────────────────────────
async function removeTag(tagIdx) {
  if (selectedIdx < 0) return;
  const item = imageFiles[selectedIdx];
  ctagSelected.delete(item.tags[tagIdx]);
  item.tags.splice(tagIdx, 1);
  await saveTags(item);
  renderCurrentTags();
  updateGalleryRow(selectedIdx);
  showToast(t('toast.remove.success'),'info',1500);
}

async function editTag(tagIdx, anchorEl) {
  if (selectedIdx < 0) return;
  const item = imageFiles[selectedIdx];
  const oldTag = item.tags[tagIdx];
  if (oldTag === undefined) return;

  openTagEditModal(oldTag, async (v) => {
    if (!v) { showToast(t('toast.tag.edit.empty'), 'warn', 1500); return; }
    if (v === oldTag) return;
    if (item.tags.includes(v)) {
      showToast(t('toast.tag.exists') + ' ' + v, 'warn', 1800);
      return;
    }
    item.tags[tagIdx] = v;
    try {
      await saveTags(item);
      renderCurrentTags();
      updateGalleryRow(selectedIdx);
      showToast(t('toast.tag.edit.success'), 'info', 1500);
    } catch {
      item.tags[tagIdx] = oldTag;
      renderCurrentTags();
    }
  }, anchorEl);
}

// ─── Save tags ─────────────────────────────────────────────
async function saveTags(item) {
  try {
    if (!item.txtHandle) {
      item.txtHandle = await folderHandle.getFileHandle(item.base + '.txt', { create: true });
    }
    const writable = await item.txtHandle.createWritable();
    await writable.write(item.tags.join(', '));
    await writable.close();
  } catch (e) {
    showToast(t('toast.write.fail') + ' ' + e.message, 'warn', 3000);
    throw e;
  }
}

// ─── Handle tag click (write mode only) ────────────────────
async function handleTagClick(tagName) {
  const fullTag = tagName + getSuffix();
  if (selectedIdx >= 0 && folderHandle) {
    const item = imageFiles[selectedIdx];
    if (item.tags.includes(fullTag)) {
      showToast(t('toast.tag.exists') + ' ' + fullTag, 'warn', 1800);
      return;
    }
    insertTag(item, fullTag);
    try {
      await saveTags(item);
      renderCurrentTags();
      updateGalleryRow(selectedIdx);
      showToast(t('toast.tag.write') + ' ' + fullTag, 'info', 1800);
    } catch { item.tags.pop(); }
  } else {
    try { await navigator.clipboard.writeText(fullTag); } catch {
      const ta = document.createElement('textarea');
      ta.value = fullTag; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    showToast(t('toast.tag.copy') + ' ' + fullTag);
  }
}

// ─── Batch add tags ────────────────────────────────────────
function showBatchPopup(event) {
  createInlinePopup(event.currentTarget, t('toast.batch.prompt'), value => {
    batchAddTagsToAll(value);
  }, { below: true, inputWidth: 320 });
}

async function batchAddTagsToAll(raw) {
  if (!folderHandle || imageFiles.length === 0) { showToast(t('toast.batch.warn'),'warn',2000); return; }
  if (typeof raw !== 'string') return;
  const newTags = raw.split(',').map(t => t.trim()).filter(Boolean);
  if (newTags.length === 0) { showToast(t('toast.batch.noinput'),'warn',2000); return; }

  const btn = $('batchBtn');
  btn.disabled = true; btn.textContent = t('toast.batch.processing');

  let successCount = 0, errorCount = 0;
  for (const item of imageFiles) {
    let added = 0;
    for (const t of newTags) { if (!item.tags.includes(t)) { insertTag(item, t); added++; } }
    if (added > 0) {
      try { await saveTags(item); successCount++; } catch { errorCount++; }
    }
  }

  btn.disabled = false; btn.innerHTML = t('batch.btn');
  if (selectedIdx >= 0) renderCurrentTags();
  renderGallery();

  if (errorCount === 0) showToast(t('toast.batch.success', {success: successCount, count: newTags.length}),'info',3000);
  else showToast(t('toast.batch.partial', {success: successCount, error: errorCount}),'warn',3500);
}

// ─── Toast ─────────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg, type='', duration=2000) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' '+type : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { t.className = ''; }, duration);
}

function showConfirm(msg) {
  return new Promise(resolve => {
    $('confirmMsg').textContent = msg;
    const overlay = $('confirm-overlay');
    overlay.classList.add('show');

    const cleanup = () => {
      overlay.classList.remove('show');
      $('confirmOk').removeEventListener('click', onOk);
      $('confirmCancel').removeEventListener('click', onCancel);
      document.removeEventListener('keydown', onKey);
    };

    const onOk = () => { cleanup(); resolve(true); };
    const onCancel = () => { cleanup(); resolve(false); };
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); onCancel(); }
      if (e.key === 'Enter') { e.preventDefault(); onOk(); }
    };

    $('confirmOk').addEventListener('click', onOk);
    $('confirmCancel').addEventListener('click', onCancel);
    document.addEventListener('keydown', onKey);
    $('confirmOk').focus();
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Long-press helper (mouse & touch) ─────────────────────
function bindLongPress(el, onLongPress, opts = {}) {
  const duration = opts.duration || 500;
  let timer = null;
  let fired = false;
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  el.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    fired = false;
    cancel();
    timer = setTimeout(() => { timer = null; fired = true; onLongPress(e); }, duration);
  });
  el.addEventListener('pointerup', cancel);
  el.addEventListener('pointerleave', cancel);
  el.addEventListener('pointercancel', cancel);
  // 长按触发后抑制紧随的 click，避免误触其他点击行为
  el.addEventListener('click', e => {
    if (fired) { fired = false; e.stopPropagation(); e.preventDefault(); }
  }, true);
  // 触屏长按会弹出系统 contextmenu，按压期间屏蔽
  el.addEventListener('contextmenu', e => { if (timer || fired) e.preventDefault(); });
}

<script>
let tagGroups  = [];
let tgEditId   = null;
let tgSelected = new Set();

function debounce(fn, ms) {
  let timer = null;
  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), ms);
  };
}
var renderTgModalTagsDebounced = debounce(renderTgModalTags, 120);
var renderCatTagsDebounced = debounce(renderCatTags, 120);
var onTagSidebarSearchDebounced = debounce(onTagSidebarSearch, 120);
var onGallerySearchDebounced = debounce(onGallerySearch, 200);

const TG_STORAGE_KEY = 'anatomy_tag_groups_v1';

// ─── Tag Sidebar Rendering ────────────────────────────────────────

}

// ─── Tag Sidebar Search ───────────────────────────────────────────
function onTagSidebarSearch() {
  const searchInput = $('tagSidebarSearch');
  const keyword = searchInput.value.trim().toLowerCase();
  const resultsContainer = $('tagSearchResults');
  const resultsList = $('tagSearchResultsList');
  
  if (!keyword) {
    resultsContainer.style.display = 'none';
    return;
  }
  
  // 收集所有来自categories的标签
  const allTags = [];
  categories.forEach(cat => {
    cat.tags.forEach(tag => {
      allTags.push({
        name: tag,
        category: cat.name,
        catId: cat.id
      });
    });
  });
  
  // 搜索匹配的标签
  const exact = isExactSearchMode(SIDEBAR_SEARCH_MODE_KEY);
  const matchedTags = allTags.filter(tag => {
    if (exact) return tag.name.toLowerCase() === keyword;
    // 模糊：支持英文搜索（包含匹配）
    if (tag.name.toLowerCase().includes(keyword)) return true;
    // 模糊：支持英文首字母搜索
    const words = tag.name.split(/[\s_]+/);
    const firstLetters = words.map(w => w.charAt(0)).join('');
    if (firstLetters.toLowerCase().includes(keyword)) return true;
    return false;
  });
  
  // 渲染搜索结果
  resultsList.innerHTML = '';
  if (matchedTags.length === 0) {
    resultsList.innerHTML = `<div style="font-size:9px;color:var(--muted);font-style:italic">${t('tag.sidebar.search.noresults')}</div>`;
  } else {
    matchedTags.forEach(tag => {
      const tagEl = document.createElement('div');
      tagEl.className = 'ts-tag-item';
      tagEl.style.cursor = 'pointer';
      tagEl.textContent = tag.name;
      tagEl.title = `${tag.category} · ${t('tag.sidebar.item.hint')}`;
      tagEl.addEventListener('click', () => handleTagClick(tag.name));
      // 长按编辑标签
      bindLongPress(tagEl, () => editSidebarTag(tag.catId, tag.name, tagEl, true));
      resultsList.appendChild(tagEl);
    });
  }
  
  resultsContainer.style.display = 'block';
}

async function addTagFromSidebar(tagName, tagEl) {

async function applyTagGroup(id, chipEl) {
  const grp = tagGroups.find(g => g.id === id);
  if (!grp) return;
  const suffix   = getSuffix();
  const tagsToAdd = grp.tags.map(t => t + suffix);

  if (selectedIdx >= 0 && folderHandle) {
    const item = imageFiles[selectedIdx];
    let added = 0, skipped = 0;
    for (const t of tagsToAdd) {
      if (item.tags.includes(t)) { skipped++; }
      else { insertTag(item, t); added++; }
    }
    if (added > 0) {
      try {
        await saveTags(item);
        renderCurrentTags();
        updateGalleryRow(selectedIdx);
        chipEl && chipEl.classList.add('applying');
        setTimeout(() => chipEl && chipEl.classList.remove('applying'), 700);
        const skipText = skipped > 0 ? t('toast.tg.apply.skip', {skipped}) : '';
        showToast(t('toast.tg.apply.success', {name: grp.name, added, skipped: skipText}), 'info', 2500);
      } catch {}
    } else {
      showToast(t('toast.tg.apply.all.skip', {name: grp.name, skipped}), 'warn', 2000);
    }
  } else {
    const text = tagsToAdd.join(', ');
    try { await navigator.clipboard.writeText(text); } catch {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    }
    chipEl && chipEl.classList.add('applying');
    setTimeout(() => chipEl && chipEl.classList.remove('applying'), 700);
    showToast(t('toast.tg.copy.success', {name: grp.name, count: tagsToAdd.length}), 'info', 2200);
  }
}
