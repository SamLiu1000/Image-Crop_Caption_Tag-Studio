    });
    section.appendChild(tagsDiv);
    body.appendChild(section);
  });

  renderTgModalCustomTags(body, kw, customTags);
}

function renderTgModalCustomTags(body, kw, customTags) {
  if (!body) body = $('tgModalBody');
  if (typeof kw !== 'string') kw = $('tgModalSearch').value.trim().toLowerCase();
  if (!customTags) {
    const allCatTags = new Set();
    categories.forEach(cat => cat.tags.forEach(t => allCatTags.add(t)));
    customTags = [...tgSelected].filter(t => !allCatTags.has(t));
  }

  const existing = body.querySelector('.tg-modal-custom-section');
  if (existing) existing.remove();

  const filteredCustomTags = customTags.filter(t => !kw || t.toLowerCase().includes(kw));
  if (filteredCustomTags.length === 0) return;

  const section = document.createElement('div');
  section.className = 'tg-modal-section tg-modal-custom-section';
  section.innerHTML = `<div class="tg-modal-sec-title" style="color:var(--c4)">已选自定义标签</div>`;
  const tagsDiv = document.createElement('div');
  tagsDiv.className = 'tg-modal-tags';

  filteredCustomTags.forEach(tag => {
    const el = document.createElement('div');
    el.className = 'tg-sel-tag selected';
    el.dataset.en = tag;

    const label = document.createElement('span');
    label.className = 'tg-sel-tag-cn';
    label.textContent = tag;
    label.addEventListener('click', () => {
      tgSelected.delete(tag);
      tgSummaryRemove(tag);
      renderTgModalCustomTags();
      updateTgSelCount();
    });

    const deleteBtn = document.createElement('span');
    deleteBtn.className = 'ctag-del';
    deleteBtn.style.marginLeft = '6px';
    deleteBtn.textContent = '×';
    deleteBtn.addEventListener('click', (event) => removeCustomTagFromGroup(tag, event));

    el.appendChild(label);
    el.appendChild(deleteBtn);
    tagsDiv.appendChild(el);
  });
  section.appendChild(tagsDiv);
  body.appendChild(section);
}

function removeCustomTagFromGroup(tag, event) {
  if (event) event.stopPropagation();
  tgSelected.delete(tag);
  tgSummaryRemove(tag);
  renderTgModalCustomTags();
  updateTgSelCount();
}

function tgToggleSelectAll() {
  const visible = document.querySelectorAll('#tgModalBody .tg-sel-tag');
  const allSel  = [...visible].every(el => el.classList.contains('selected'));
  visible.forEach(el => {
    const tag = el.dataset.en;
    if (allSel) { tgSelected.delete(tag); el.classList.remove('selected'); }
    else { tgSelected.add(tag); el.classList.add('selected'); }
  });
  $('tgSelAllBtn').textContent = allSel ? t('tg.modal.select.none') : t('tg.modal.select.all');
  updateTgSelCount();
  updateTgSelectedSummary();
}

function updateTgSelCount() {
  const n = tgSelected.size;
  $('tgSelCount').textContent = n;
  $('tgModalSave').disabled = (n === 0);
}

function updateTgSelectedSummary() {
  const container = $('tgSelectedSummaryTags');
  container.innerHTML = '';

  if (tgSelected.size === 0) {
    container.innerHTML = `<span style="font-size:9px;color:var(--muted);font-style:italic">${t('tg.modal.selected.empty')}</span>`;
    return;
  }

  const sortedTags = [...tgSelected].sort();
  sortedTags.forEach(tag => tgSummaryAppendTag(container, tag));
}

function tgSummaryAppendTag(container, tag) {
  const el = document.createElement('div');
  el.className = 'tg-summary-tag';
  el.dataset.tag = tag;

  const label = document.createElement('span');
  label.textContent = tag;

  const deleteBtn = document.createElement('span');
  deleteBtn.className = 'ctag-del';
  deleteBtn.textContent = '×';
  deleteBtn.addEventListener('click', (event) => removeTagFromSummary(tag, event));

  el.appendChild(label);
  el.appendChild(deleteBtn);
  container.appendChild(el);
  return el;
}

function tgSummaryAdd(tag) {
  const container = $('tgSelectedSummaryTags');
  if (tgSelected.size === 1) container.innerHTML = '';

  const els = [...container.querySelectorAll('.tg-summary-tag')];
  let insertBefore = null;
  for (const e of els) {
    if (e.dataset.tag === tag) return;
    if (e.dataset.tag > tag && !insertBefore) insertBefore = e;
  }
  const el = tgSummaryAppendTag(container, tag);
  if (insertBefore) container.insertBefore(el, insertBefore);
}

function tgSummaryRemove(tag) {
  const container = $('tgSelectedSummaryTags');
  const els = container.querySelectorAll('.tg-summary-tag');
  for (const el of els) {
    if (el.dataset.tag === tag) { el.remove(); break; }
  }
  if (tgSelected.size === 0) {
    container.innerHTML = `<span style="font-size:9px;color:var(--muted);font-style:italic">${t('tg.modal.selected.empty')}</span>`;
  }
}

function removeTagFromSummary(tag, event) {
  if (event) event.stopPropagation();
  tgSelected.delete(tag);
  tgSummaryRemove(tag);
  updateTgSelCount();

  // 判断是栏目标签还是自定义标签
  const allCatTags = new Set();
  categories.forEach(cat => cat.tags.forEach(t => allCatTags.add(t)));

  if (allCatTags.has(tag)) {
    // 栏目标签 — 仅取消该元素选中态
    const modalTags = document.querySelectorAll('#tgModalBody .tg-sel-tag');
    for (const el of modalTags) {
      if (el.dataset.en === tag) { el.classList.remove('selected'); break; }
    }
  } else {
    // 自定义标签 — 仅重建自定义区
    renderTgModalCustomTags();
  }
}

function closeInlinePopup() {
  const existing = document.querySelector('.inline-input-popup');
  if (existing) {
    if (existing._cleanup) existing._cleanup();
    else existing.remove();
  }
}

function createInlinePopup(btn, placeholder, onSubmit, opts = {}) {
  closeInlinePopup();
  const parentBtn = btn;
  const origOnClick = parentBtn.onclick;
  parentBtn.onclick = null;

  const popup = document.createElement('div');
  popup.className = 'inline-input-popup';
  popup.innerHTML = '<input type="text" placeholder="' + placeholder + '" /><button class="ip-confirm">确认</button><button class="ip-cancel">取消</button>';
  if (opts.below) { popup.style.bottom = 'auto'; popup.style.top = 'calc(100% + 4px)'; }
  if (opts.inputWidth) popup.querySelector('input').style.width = opts.inputWidth + 'px';

  popup.addEventListener('click', e => e.stopPropagation());
  popup.addEventListener('mousedown', e => e.stopPropagation());
  popup.addEventListener('keydown', e => e.stopPropagation());

  const input = popup.querySelector('input');
  const confirmBtn = popup.querySelector('.ip-confirm');
  const cancelBtn = popup.querySelector('.ip-cancel');

  const cleanup = () => {
    popup._cleanup = null;
    if (popup.parentNode) popup.remove();
    parentBtn.onclick = origOnClick;
  };
  popup._cleanup = cleanup;

  const submit = () => {
    cleanup();
    onSubmit(input.value.trim());
  };

  input.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
    if (e.key === 'Escape') { e.preventDefault(); cleanup(); }
    if (e.key === ' ') e.stopPropagation();
  });

  confirmBtn.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); submit(); });
  cancelBtn.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); cleanup(); });

  btn.appendChild(popup);
  setTimeout(() => { input.focus(); input.select(); }, 0);
}

function showCustomTagPopup(event) {
  createInlinePopup(event.currentTarget, t('toast.tg.custom.prompt'), value => {
    addCustomTagToGroup(value);
  });
}

function showCategoryPopup(event) {
  createInlinePopup(event.currentTarget, t('toast.cat.add.prompt'), value => {
    addNewCategory(value);
  });
}

function showCatTagPopup(event) {
  createInlinePopup(event.currentTarget, t('toast.cat.tag.add.prompt'), value => {
    addNewTagToCategory(value);
  });
}

function addCustomTagToGroup(tag) {
  if (!tag || !tag.trim()) return;

  const trimmedTag = tag.trim();

  // 检查是否已存在于已选标签中
  if (tgSelected.has(trimmedTag)) {
    showToast(t('toast.tg.custom.exists'), 'warn', 1800);
    return;
  }

  // 添加到已选标签集合
  tgSelected.add(trimmedTag);

  // 更新UI（仅增量更新，不重建整个模态）
  tgSummaryAdd(trimmedTag);
  renderTgModalCustomTags();
  updateTgSelCount();

  showToast(t('toast.tg.custom.success', {tag: trimmedTag}), 'info', 1800);
}

function saveTgGroup() {
  const name = $('tgModalNameInput').value.trim();
  if (!name) { $('tgModalNameInput').focus(); showToast(t('toast.tg.save.warn'),'warn',1800); return; }
  if (tgSelected.size === 0) { showToast(t('toast.tg.select.warn'),'warn',1800); return; }

  if (tgEditId) {
    const grp = tagGroups.find(g => g.id === tgEditId);
    if (grp) { grp.name = name; grp.tags = [...tgSelected]; }
  } else {
    tagGroups.push({ id: 'tg_' + Date.now(), name, tags: [...tgSelected] });
  }

  tgSave(); renderTagGroups(); closeTgModal();
  showToast(t('toast.tg.save.success', {name, count: tgSelected.size}), 'info', 2500);
}

function showSaveGroupPopup(event) {
  createInlinePopup(event.currentTarget, t('toast.savegroup.prompt'), value => {
    const trimmed = (value || '').trim();
    if (!trimmed) return;
    tagGroups.push({ id: 'tg_' + Date.now(), name: trimmed, tags: [...ctagSelected] });
    tgSave(); renderTagGroups();
    showToast(t('toast.tg.save.success', {name: trimmed, count: ctagSelected.size}), 'info', 2500);
    toggleCtagSelectMode(false);
  });
}

// ═══════════════════ CATEGORIES MANAGEMENT FUNCTIONS ═══════════════════
function sortCatTags() {
  const cat = categories.find(c => c.id === catTagEditId);
  if (!cat) return;

  cat.tags.sort((a, b) => a.localeCompare(b));
  catSave();

  renderCatTags();
  renderCatList();
  renderTagSidebar();
  showToast(t('toast.cat.sort.success', {count: cat.tags.length}), 'info', 1800);
}

function openCatModal() {
  const overlay = $('catModalOverlay');
  overlay.classList.remove('hidden');
  renderCatList();
}

function closeCatModal() {
  closeInlinePopup();
  $('catModalOverlay').classList.add('hidden');
}

function onCatOverlayClick(e) {
  if (e.target === $('catModalOverlay')) closeCatModal();
}

function renderCatList() {
  const list = $('catList');
  list.innerHTML = '';
  
  if (categories.length === 0) {
    list.innerHTML = `<div style="font-size:10px;color:var(--muted);font-style:italic">${t('cat.modal.empty')}</div>`;
    return;
  }
  
  categories.forEach(cat => {
    const catEl = document.createElement('div');
    catEl.className = 'tg-modal-section';
    catEl.style.marginBottom = '12px';
    catEl.style.padding = '10px';
    catEl.style.background = 'var(--tag-bg)';
    catEl.style.borderRadius = '6px';
    catEl.style.border = '1px solid var(--border)';
    
    const header = document.createElement('div');
    header.style.display = 'flex';
    header.style.alignItems = 'center';
    header.style.justifyContent = 'space-between';
    header.style.marginBottom = '8px';
    
    const nameDiv = document.createElement('div');
    nameDiv.style.fontSize = '11px';
    nameDiv.style.fontWeight = '600';
    nameDiv.style.color = 'var(--c3)';
    nameDiv.textContent = cat.name;
    
    const actions = document.createElement('div');
    actions.style.display = 'flex';
    actions.style.gap = '6px';
    
    const manageBtn = document.createElement('button');
    manageBtn.className = 'tg-sel-all-btn';
    manageBtn.style.borderColor = 'var(--c3)';
    manageBtn.style.color = 'var(--c3)';
    manageBtn.textContent = t('cat.tags.modal.manage');
    manageBtn.onclick = () => openCatTagsModal(cat.id);
    
    const delBtn = document.createElement('button');
    delBtn.className = 'tg-sel-all-btn';
    delBtn.style.borderColor = 'var(--danger)';
    delBtn.style.color = 'var(--danger)';
    delBtn.textContent = t('cat.tags.modal.delete');
    delBtn.onclick = () => deleteCategory(cat.id);
    
    actions.appendChild(manageBtn);
    actions.appendChild(delBtn);
    
    header.appendChild(nameDiv);
    header.appendChild(actions);
    
    const tagsPreview = document.createElement('div');
    tagsPreview.style.fontSize = '9px';
    tagsPreview.style.color = 'var(--muted)';
    tagsPreview.style.lineHeight = '1.5';
    tagsPreview.textContent = `${t('cat.tags.modal.count', {count: cat.tags.length}).replace('{count}', cat.tags.length)}：${cat.tags.slice(0, 5).join(', ')}${cat.tags.length > 5 ? '...' : ''}`;
    
    catEl.appendChild(header);
    catEl.appendChild(tagsPreview);
    list.appendChild(catEl);
  });
}

function addNewCategory(name) {
  if (!name || !name.trim()) return;

  categories.push({
    id: 'cat_' + Date.now(),
    name: name.trim(),
    tags: []
  });

  catSave();
  renderCatList();
  setTimeout(() => renderTagSidebar(), 0);
  showToast(t('toast.cat.add.success', {name: name.trim()}), 'info', 2000);
}

async function deleteCategory(id) {
  const cat = categories.find(c => c.id === id);
  if (!cat) return;

  if (!await showConfirm(t('toast.cat.delete.confirm', {name: cat.name}))) return;

  categories = categories.filter(c => c.id !== id);
  catSave();
  renderCatList();
  setTimeout(() => renderTagSidebar(), 0);
  showToast(t('toast.cat.delete.success', {name: cat.name}), 'info', 1800);
}

function openCatTagsModal(catId) {
  catTagEditId = catId;
  const cat = categories.find(c => c.id === catId);
  if (!cat) return;
  
  $('catTagsModalTitle').textContent = t('cat.tags.modal.title.prefix') + cat.name + t('cat.tags.modal.title.suffix');
  $('catNameInput').value = cat.name;
  $('catTagSearch').value = '';
  $('catTagsModalOverlay').classList.remove('hidden');
  renderCatTags();
}

function closeCatTagsModal() {
  closeInlinePopup();
  $('catTagsModalOverlay').classList.add('hidden');
  catTagEditId = null;
}

function onCatTagsOverlayClick(e) {
  if (e.target === $('catTagsModalOverlay')) closeCatTagsModal();
}

function saveCategoryName() {
  const cat = categories.find(c => c.id === catTagEditId);
  if (!cat) return;
  
  const name = $('catNameInput').value.trim();
  if (!name) {
    showToast(t('toast.cat.name.warn'), 'warn', 1800);
    return;
  }
  
  cat.name = name;
  catSave();
  $('catTagsModalTitle').textContent = t('cat.tags.modal.title.prefix') + name + t('cat.tags.modal.title.suffix');
  renderCatList();
  setTimeout(() => renderTagSidebar(), 0);
  showToast(t('toast.cat.name.success'), 'info', 1800);
}

function renderCatTags() {
  const body = $('catTagsModalBody');
  const kw = $('catTagSearch').value.trim().toLowerCase();
  const cat = categories.find(c => c.id === catTagEditId);
  if (!cat) return;
  
  body.innerHTML = '';
  
  const filteredTags = cat.tags.filter(tag =>
    !kw || tag.toLowerCase().includes(kw)
  );

  if (filteredTags.length === 0) {
    body.innerHTML = `<div style="font-size:10px;color:var(--muted);font-style:italic;text-align:center;padding:20px">${t('cat.tags.modal.empty')}</div>`;
    $('catTagsCount').innerHTML = t('cat.tags.modal.count', {count: '0'});
    return;
  }
  
  const tagsDiv = document.createElement('div');
  tagsDiv.className = 'tg-modal-tags';

  filteredTags.forEach(tag => {
    tagsDiv.appendChild(createCatTagElement(tag));
  });

  body.appendChild(tagsDiv);
  $('catTagsCount').innerHTML = t('cat.tags.modal.count', {count: cat.tags.length});
}

function createCatTagElement(tag) {
  const el = document.createElement('div');
  el.className = 'tg-sel-tag';
  el.style.position = 'relative';

  const label = document.createElement('span');
  label.className = 'tg-sel-tag-cn';
  label.textContent = tag;
  label.title = t('cat.tags.modal.edit.hint');

  const deleteBtn = document.createElement('span');
  deleteBtn.className = 'ctag-del';
  deleteBtn.style.position = 'absolute';
  deleteBtn.style.top = '2px';
  deleteBtn.style.right = '2px';
  deleteBtn.style.fontSize = '10px';
  deleteBtn.style.padding = '0 4px';
  deleteBtn.textContent = '×';
  deleteBtn.addEventListener('click', (event) => deleteCatTag(tag, event));

  el.appendChild(label);
  el.appendChild(deleteBtn);

  // 长按编辑标签
  bindLongPress(el, () => editCatTag(tag, el), { suppressClick: true });
  return el;
}

function editCatTag(tag, tagEl) {
  openTagEditModal(tag, (v) => {
    if (v && v !== tag) renameCatTag(catTagEditId, tag, v);
    renderCatTags();
    setTimeout(() => { renderCatList(); renderTagSidebar(); }, 0);
  }, tagEl);
}

function addNewTagToCategory(tag) {
  if (!tag || !tag.trim()) return;
  addTagToCategory(catTagEditId, tag.trim());
}

function addTagToCategory(catId, trimmedTag) {
  const cat = categories.find(c => c.id === catId);
  if (!cat) return;

  if (cat.tags.includes(trimmedTag)) {
    showToast(t('toast.cat.tag.exists'), 'warn', 1800);
    return;
  }

  cat.tags.push(trimmedTag);
  catSave();

  // 若该栏目的管理弹窗正打开，增量追加 — 仅当无搜索关键词或匹配当前搜索时
  if (catTagEditId === catId && !$('catTagsModalOverlay').classList.contains('hidden')) {
    const kw = $('catTagSearch').value.trim().toLowerCase();
    if (!kw || trimmedTag.toLowerCase().includes(kw)) {
      appendCatTagElement(trimmedTag);
    }
    $('catTagsCount').innerHTML = t('cat.tags.modal.count', {count: cat.tags.length});
  }

  // 延迟重建较重的列表
  setTimeout(() => {
    renderCatList();
    renderTagSidebar();
  }, 0);

  showToast(t('toast.cat.tag.add.success', {tag: trimmedTag}), 'info', 1800);
}

function showSidebarCatTagPopup(catId, event) {
  event.stopPropagation();
  createInlinePopup(event.currentTarget, t('toast.cat.tag.add.prompt'), value => {
    if (value) addTagToCategory(catId, value);
  });
}

// 重命名栏目中的标签（栏目标签库共用）
function renameCatTag(catId, oldTag, newTag) {
  const cat = categories.find(c => c.id === catId);
  if (!cat) return false;
  const i = cat.tags.indexOf(oldTag);
  if (i < 0) return false;
  if (cat.tags.includes(newTag)) {
    showToast(t('toast.cat.tag.exists'), 'warn', 1800);
    return false;
  }
  cat.tags[i] = newTag;
  catSave();
  showToast(t('toast.tag.edit.success'), 'info', 1500);
  return true;
}

// 侧边栏标签长按编辑（界面使用时的栏目标签 / 搜索结果标签）
function editSidebarTag(catId, tag, el, inSearch) {
  openTagEditModal(tag, (v) => {
    if (v && v !== tag) renameCatTag(catId, tag, v);
    renderTagSidebar();
    if (inSearch) onTagSidebarSearch();
    setTimeout(() => { renderCatList(); }, 0);
  }, el);
}

function appendCatTagElement(tag) {
  const body = $('catTagsModalBody');
  let tagsDiv = body.querySelector('.tg-modal-tags');
  if (!tagsDiv) {
    body.innerHTML = '';
    tagsDiv = document.createElement('div');
    tagsDiv.className = 'tg-modal-tags';
    body.appendChild(tagsDiv);
  }
  tagsDiv.appendChild(createCatTagElement(tag));
}

async function deleteCatTag(tag, event) {
  if (event) event.stopPropagation();

  const cat = categories.find(c => c.id === catTagEditId);
  if (!cat) return;

  if (!await showConfirm(t('toast.cat.tag.delete.confirm', {tag}))) return;

  cat.tags = cat.tags.filter(tagItem => tagItem !== tag);
  catSave();

  // 增量更新 — 仅移除该标签元素，避免重建整个列表
  const body = $('catTagsModalBody');
  const tagEls = body.querySelectorAll('.tg-sel-tag');
  for (const el of tagEls) {
    const label = el.querySelector('.tg-sel-tag-cn');
    if (label && label.textContent === tag) { el.remove(); break; }
  }
  $('catTagsCount').innerHTML = t('cat.tags.modal.count', {count: cat.tags.length});

  // 延迟重建较重的列表（栏目管理列表 + 侧边栏）
  setTimeout(() => {
    renderCatList();
    renderTagSidebar();
  }, 0);

  showToast(t('toast.cat.tag.delete.success', {tag}), 'info', 1500);
}
</script>
